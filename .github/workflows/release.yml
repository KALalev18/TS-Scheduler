name: Release

# Opens a "Version Packages" pull request from pending changesets. Merging it
# publishes to npm with trusted publishing (OIDC, no token stored in the repo);
# npm adds provenance automatically.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  release:
    # npm provenance needs a public repository, so releases start once it is public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run check
      - uses: changesets/action@v2.1.2
        with:
          version: npx changeset version
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
