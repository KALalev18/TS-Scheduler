name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Test with coverage
        run: npm run coverage
      - run: npm run build
      - name: CLI smoke test
        run: node dist/cli.js next "FREQ=DAILY;BYHOUR=2;BYMINUTE=30" --tz Europe/Berlin --start 2026-03-27T00:00 -n 3
      - name: Check package contents
        run: npm pack --dry-run
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        shell: bash
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Coverage", "| Metric | % | Covered |", "| --- | ---: | ---: |",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
