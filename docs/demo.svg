<g class="l" style="animation-name:a22"><text x="18" y="431" xml:space="preserve"><tspan fill="#7f848e">14:52:04  </tspan><tspan fill="#56b6c2">started</tspan><tspan fill="#c8ccd4">   b562bd7f  upload report (attempt 3)</tspan></text></g>
