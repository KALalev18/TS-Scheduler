<svg xmlns="http://www.w3.org/2000/svg" width="982" height="504" viewBox="0 0 982 504" role="img" aria-label="ts-scheduler CLI demo">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
.l{opacity:0;animation-duration:9.8s;animation-iteration-count:infinite;animation-timing-function:step-end}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}
</style>
<rect width="982" height="504" rx="8" fill="#282c34"/>
<circle cx="20" cy="18" r="6" fill="#ff5f56"/><circle cx="40" cy="18" r="6" fill="#ffbd2e"/><circle cx="60" cy="18" r="6" fill="#27c93f"/>
<text x="491" y="22" text-anchor="middle" fill="#7f848e">ts-scheduler demo</text>
<g class="l" style="animation-name:a0"><text x="18" y="57" xml:space="preserve"><tspan fill="#61afef">$</tspan><tspan fill="#e6e6e6"> ts-scheduler next "FREQ=DAILY;BYHOUR=2;BYMINUTE=30" --tz Europe/Berlin --start 2027-03-26T00:00 -n 4</tspan></text></g>
<style>@keyframes a0{0%,3.05%{opacity:0}3.06%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a1"><text x="18" y="74" xml:space="preserve"><tspan fill="#c8ccd4">FREQ=DAILY;BYHOUR=2;BYMINUTE=30 in Europe/Berlin</tspan></text></g>
<style>@keyframes a1{0%,8.14%{opacity:0}8.15%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a2"><text x="18" y="91" xml:space="preserve"><tspan fill="#c8ccd4">  2027-03-26 02:30:00+01:00</tspan></text></g>
<style>@keyframes a2{0%,8.65%{opacity:0}8.66%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a3"><text x="18" y="108" xml:space="preserve"><tspan fill="#c8ccd4">  2027-03-27 02:30:00+01:00</tspan></text></g>
<style>@keyframes a3{0%,9.16%{opacity:0}9.17%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a4"><text x="18" y="125" xml:space="preserve"><tspan fill="#c8ccd4">  2027-03-28 03:30:00+02:00</tspan><tspan fill="#e5c07b" font-style="italic">   ← 02:30 doesn't exist on the DST day, so it runs at 03:30</tspan></text></g>
<style>@keyframes a4{0%,9.67%{opacity:0}9.68%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a5"><text x="18" y="142" xml:space="preserve"><tspan fill="#c8ccd4">  2027-03-29 02:30:00+02:00</tspan></text></g>
<style>@keyframes a5{0%,10.18%{opacity:0}10.19%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a6"><text x="18" y="159" xml:space="preserve"><tspan fill="#61afef">$</tspan><tspan fill="#e6e6e6"> ts-scheduler add "nightly backup" --priority 5 --work 800ms</tspan></text></g>
<style>@keyframes a6{0%,14.76%{opacity:0}14.77%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a7"><text x="18" y="176" xml:space="preserve"><tspan fill="#c8ccd4">added 128b9b9b, first run 2026-10-27 14:52:03+02:00</tspan></text></g>
<style>@keyframes a7{0%,19.85%{opacity:0}19.86%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a8"><text x="18" y="193" xml:space="preserve"><tspan fill="#61afef">$</tspan><tspan fill="#e6e6e6"> ts-scheduler add "send newsletter" --deadline 300ms</tspan></text></g>
<style>@keyframes a8{0%,24.43%{opacity:0}24.44%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a9"><text x="18" y="210" xml:space="preserve"><tspan fill="#c8ccd4">added 25666854, first run 2026-10-27 14:52:03+02:00</tspan></text></g>
<style>@keyframes a9{0%,29.52%{opacity:0}29.53%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a10"><text x="18" y="227" xml:space="preserve"><tspan fill="#61afef">$</tspan><tspan fill="#e6e6e6"> ts-scheduler add "upload report" --retries 2 --fail-first 2 --backoff 200ms</tspan></text></g>
<style>@keyframes a10{0%,34.10%{opacity:0}34.11%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a11"><text x="18" y="244" xml:space="preserve"><tspan fill="#c8ccd4">added b562bd7f, first run 2026-10-27 14:52:03+02:00</tspan></text></g>
<style>@keyframes a11{0%,39.19%{opacity:0}39.20%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a12"><text x="18" y="261" xml:space="preserve"><tspan fill="#61afef">$</tspan><tspan fill="#e6e6e6"> ts-scheduler run --for 2s</tspan></text></g>
<style>@keyframes a12{0%,43.77%{opacity:0}43.78%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a13"><text x="18" y="278" xml:space="preserve"><tspan fill="#c8ccd4">running 3 pending task(s), press Ctrl+C to stop</tspan></text></g>
<style>@keyframes a13{0%,49.00%{opacity:0}49.01%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a14"><text x="18" y="295" xml:space="preserve"><tspan fill="#7f848e">14:52:03  </tspan><tspan fill="#56b6c2">started</tspan><tspan fill="#c8ccd4">   128b9b9b  nightly backup</tspan><tspan fill="#e5c07b" font-style="italic">   ← highest priority runs first</tspan></text></g>
<style>@keyframes a14{0%,49.01%{opacity:0}49.02%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a15"><text x="18" y="312" xml:space="preserve"><tspan fill="#c8ccd4">          › nightly backup</tspan></text></g>
<style>@keyframes a15{0%,57.25%{opacity:0}57.26%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a16"><text x="18" y="329" xml:space="preserve"><tspan fill="#7f848e">14:52:04  </tspan><tspan fill="#98c379">done</tspan><tspan fill="#c8ccd4">      128b9b9b  nightly backup in 808ms</tspan></text></g>
<style>@keyframes a16{0%,57.26%{opacity:0}57.27%,97%{opacity:1}100%{opacity:0}}</style>
