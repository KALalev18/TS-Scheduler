<svg xmlns="http://www.w3.org/2000/svg" width="1098" height="640" viewBox="0 0 1098 640" role="img" aria-label="ts-scheduler CLI demo">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12px}
.l{opacity:0;animation-duration:19.9s;animation-iteration-count:infinite;animation-timing-function:step-end}
