<style>@keyframes a17{0%,57.27%{opacity:0}57.28%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a18"><text x="18" y="363" xml:space="preserve"><tspan fill="#7f848e">14:52:04  </tspan><tspan fill="#56b6c2">started</tspan><tspan fill="#c8ccd4">   b562bd7f  upload report</tspan></text></g>
