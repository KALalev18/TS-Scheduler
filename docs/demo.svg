<g class="l" style="animation-name:a19"><text x="18" y="380" xml:space="preserve"><tspan fill="#7f848e">14:52:04  </tspan><tspan fill="#e06c75">failed</tspan><tspan fill="#c8ccd4">    b562bd7f  upload report simulated failure 1/2, retry in 102ms</tspan><tspan fill="#e5c07b" font-style="italic">   ← retried with exponential backoff and jitter</tspan></text></g>
<style>@keyframes a19{0%,57.29%{opacity:0}57.30%,97%{opacity:1}100%{opacity:0}}</style>
<g class="l" style="animation-name:a20"><text x="18" y="397" xml:space="preserve"><tspan fill="#7f848e">14:52:04  </tspan><tspan fill="#56b6c2">started</tspan><tspan fill="#c8ccd4">   b562bd7f  upload report (attempt 2)</tspan></text></g>
